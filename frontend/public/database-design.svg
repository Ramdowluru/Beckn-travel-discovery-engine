<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title description">
  <title id="title">Travel Discovery Engine database design</title>
  <desc id="description">Entity relationship diagram for users, providers, locations, travel catalog items, journeys, and bookings.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0c2f2b" flood-opacity=".12"/>
    </filter>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3267b1"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c77732"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2f8660"/>
    </marker>
    <style>
      .title { font: 700 31px Georgia, serif; fill: #103d38; }
      .subtitle { font: 400 16px Arial, sans-serif; fill: #58706d; letter-spacing: 1px; }
      .entity { fill: #fffdf9; stroke: #b9c9c3; stroke-width: 2; }
      .entity-head { fill: #123f38; }
      .entity-name { font: 700 17px Arial, sans-serif; fill: #fffdf9; }
      .field { font: 400 13px Arial, sans-serif; fill: #263b38; }
      .key { font-weight: 700; fill: #a45527; }
      .muted { font: italic 12px Arial, sans-serif; fill: #72827f; }
      .label { font: 700 12px Arial, sans-serif; fill: #536b66; }
      .relation { fill: none; stroke-width: 2.5; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="#f5f1e8"/>
  <path d="M0 90 H1600" stroke="#d7dfd8" stroke-width="2"/>
  <text x="800" y="47" text-anchor="middle" class="title">Travel Discovery Engine · Database Design</text>
  <text x="800" y="74" text-anchor="middle" class="subtitle">MongoDB collections · REST API domain model</text>

  <!-- Relationships behind entities -->
  <path d="M245 282 C245 355 330 385 420 420" class="relation" stroke="#c77732" marker-end="url(#arrow-orange)"/>
  <path d="M245 282 C245 365 650 380 690 420" class="relation" stroke="#c77732" marker-end="url(#arrow-orange)"/>
  <path d="M245 282 C245 365 1015 375 1015 420" class="relation" stroke="#c77732" marker-end="url(#arrow-orange)"/>
  <path d="M1350 282 C1350 350 1110 370 1015 420" class="relation" stroke="#2f8660" marker-end="url(#arrow-green)"/>
  <path d="M1350 282 C1350 350 790 370 690 420" class="relation" stroke="#2f8660" marker-end="url(#arrow-green)"/>
  <path d="M1350 282 C1350 350 480 370 420 420" class="relation" stroke="#2f8660" marker-end="url(#arrow-green)"/>
  <path d="M420 685 C450 755 520 780 580 800" class="relation" stroke="#3267b1" marker-end="url(#arrow-blue)"/>
  <path d="M690 685 C680 760 650 780 640 800" class="relation" stroke="#3267b1" marker-end="url(#arrow-blue)"/>
  <path d="M1015 685 C920 755 750 780 700 800" class="relation" stroke="#3267b1" marker-end="url(#arrow-blue)"/>
  <path d="M245 282 C180 500 220 720 420 800" class="relation" stroke="#b44a40" marker-end="url(#arrow-orange)"/>
  <path d="M245 282 C160 525 235 835 420 865" class="relation" stroke="#b44a40" marker-end="url(#arrow-orange)"/>
  <path d="M880 855 H1040" class="relation" stroke="#3267b1" marker-end="url(#arrow-blue)"/>

  <!-- Relationship labels -->
  <text x="276" y="348" class="label">has</text>
  <text x="1290" y="350" class="label">offers</text>
  <text x="454" y="755" class="label">selected in</text>
  <text x="278" y="640" class="label">creates</text>
  <text x="938" y="844" class="label">has many</text>

  <!-- users -->
  <g filter="url(#shadow)">
    <rect x="70" y="110" width="350" height="172" rx="5" class="entity"/>
    <rect x="70" y="110" width="350" height="42" rx="5" class="entity-head"/>
    <text x="94" y="137" class="entity-name">users</text>
    <text x="94" y="177" class="field key">_id (PK)</text>
    <text x="94" y="198" class="field">name · email · password_hash</text>
    <text x="94" y="219" class="field">role · preferences</text>
    <text x="94" y="240" class="field">created_at · updated_at</text>
    <text x="94" y="263" class="muted">auth and traveler profile</text>
  </g>

  <!-- locations -->
  <g filter="url(#shadow)">
    <rect x="625" y="110" width="350" height="172" rx="5" class="entity"/>
    <rect x="625" y="110" width="350" height="42" rx="5" class="entity-head"/>
    <text x="649" y="137" class="entity-name">locations</text>
    <text x="649" y="177" class="field key">_id (PK)</text>
    <text x="649" y="198" class="field">name · city · state · country</text>
    <text x="649" y="219" class="field">coordinates · type</text>
    <text x="649" y="242" class="muted">city | airport | station | hotel | attraction</text>
    <text x="649" y="263" class="muted">shared location references</text>
  </g>

  <!-- providers -->
  <g filter="url(#shadow)">
    <rect x="1180" y="110" width="350" height="172" rx="5" class="entity"/>
    <rect x="1180" y="110" width="350" height="42" rx="5" class="entity-head"/>
    <text x="1204" y="137" class="entity-name">providers</text>
    <text x="1204" y="177" class="field key">_id (PK)</text>
    <text x="1204" y="198" class="field">name · type · category · description</text>
    <text x="1204" y="219" class="field">status · integration_type · contact</text>
    <text x="1204" y="242" class="muted">mock_bpp | real_bpp | external_api</text>
    <text x="1204" y="263" class="field">created_at · updated_at</text>
  </g>

  <!-- transport -->
  <g filter="url(#shadow)">
    <rect x="245" y="420" width="350" height="265" rx="5" class="entity"/>
    <rect x="245" y="420" width="350" height="42" rx="5" class="entity-head"/>
    <text x="269" y="447" class="entity-name">transport_options</text>
    <text x="269" y="487" class="field key">_id (PK) · provider_id (FK)</text>
    <text x="269" y="508" class="field">from_location_id (FK) · to_location_id (FK)</text>
    <text x="269" y="529" class="field">departure_time · arrival_time</text>
    <text x="269" y="550" class="field">duration_minutes · vehicle_type</text>
    <text x="269" y="571" class="field">fare · availability · amenities</text>
    <text x="269" y="603" class="muted">API: /api/transport/[id]</text>
    <text x="269" y="624" class="muted">search results and direct provider booking</text>
    <text x="269" y="657" class="field">created_at · updated_at</text>
  </g>

  <!-- accommodations -->
  <g filter="url(#shadow)">
    <rect x="625" y="420" width="350" height="265" rx="5" class="entity"/>
    <rect x="625" y="420" width="350" height="42" rx="5" class="entity-head"/>
    <text x="649" y="447" class="entity-name">accommodations</text>
    <text x="649" y="487" class="field key">_id (PK) · provider_id (FK)</text>
    <text x="649" y="508" class="field">location_id (FK) · name · category</text>
    <text x="649" y="529" class="field">rating · rooms · price · amenities</text>
    <text x="649" y="550" class="field">availability · images · cancellation</text>
    <text x="649" y="603" class="muted">API: /api/stays/[id]</text>
    <text x="649" y="624" class="muted">nightly and total stay pricing</text>
    <text x="649" y="657" class="field">created_at · updated_at</text>
  </g>

  <!-- experiences -->
  <g filter="url(#shadow)">
    <rect x="1005" y="420" width="350" height="265" rx="5" class="entity"/>
    <rect x="1005" y="420" width="350" height="42" rx="5" class="entity-head"/>
    <text x="1029" y="447" class="entity-name">experiences</text>
    <text x="1029" y="487" class="field key">_id (PK) · provider_id (FK)</text>
    <text x="1029" y="508" class="field">location_id (FK) · name · category</text>
    <text x="1029" y="529" class="field">description · duration_minutes · price</text>
    <text x="1029" y="550" class="field">availability · includes · images</text>
    <text x="1029" y="603" class="muted">API: /api/experiences/[id]</text>
    <text x="1029" y="624" class="muted">local activities and guided tours</text>
    <text x="1029" y="657" class="field">created_at · updated_at</text>
  </g>

  <!-- journeys -->
  <g filter="url(#shadow)">
    <rect x="245" y="800" width="635" height="140" rx="5" class="entity"/>
    <rect x="245" y="800" width="635" height="42" rx="5" class="entity-head"/>
    <text x="269" y="827" class="entity-name">journeys</text>
    <text x="269" y="867" class="field key">_id (PK) · user_id (FK)</text>
    <text x="269" y="888" class="field">title · origin · destination · start_date · end_date</text>
    <text x="269" y="909" class="field">items[] · estimated_cost · status · is_saved</text>
    <text x="269" y="930" class="field">created_at · updated_at</text>
  </g>

  <!-- bookings -->
  <g filter="url(#shadow)">
    <rect x="1040" y="800" width="490" height="140" rx="5" class="entity"/>
    <rect x="1040" y="800" width="490" height="42" rx="5" class="entity-head"/>
    <text x="1064" y="827" class="entity-name">bookings</text>
    <text x="1064" y="867" class="field key">_id (PK) · user_id (FK) · journey_id (FK)</text>
    <text x="1064" y="888" class="field">status · items[] · total_price · booking_date</text>
    <text x="1064" y="909" class="muted">initiated | confirmed | cancelled | completed</text>
    <text x="1064" y="930" class="field">provider_refs · created_at · updated_at</text>
  </g>

  <text x="800" y="980" text-anchor="middle" class="subtitle">Catalog APIs feed journeys; bookings retain provider references and lifecycle status</text>
</svg>