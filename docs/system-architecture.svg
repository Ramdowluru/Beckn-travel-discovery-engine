<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1780" viewBox="0 0 1240 1780" font-family="'DM Sans','Segoe UI',Helvetica,Arial,sans-serif">
  <!-- ============================================================
       TDE — System Architecture (SRS §10 / §13)
       Palette: ink #1A1A18 · forest #1C2B25 · cream #F2EDE4
                cream-dark #E8E0D4 · orange #C84B2F · border #D4CEC4
       ============================================================ -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1A1A18"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#C84B2F"/>
    </marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9A9A94"/>
    </marker>
  </defs>

  <rect width="1240" height="1780" fill="#F2EDE4"/>

  <!-- ── Title ─────────────────────────────────────────────────── -->
  <text x="620" y="64" text-anchor="middle" font-family="Playfair Display, Georgia, serif" font-size="34" font-weight="700" fill="#1A1A18" letter-spacing="-0.5">Travel Discovery Engine — System Architecture</text>
  <text x="620" y="94" text-anchor="middle" font-size="14.5" font-weight="300" fill="#5C5C58">Beckn Application Platform (BAP) · unified multi-modal search &amp; booking · SRS §10 / §13</text>
  <line x1="470" y1="112" x2="770" y2="112" stroke="#C84B2F" stroke-width="2"/>

  <!-- ══════════════════ LAYER 1 · CLIENT ═══════════════════════ -->
  <text x="70" y="162" font-size="12" font-weight="700" letter-spacing="2.5" fill="#C84B2F">CLIENT · NEXT.JS FRONTEND (MOBILE-FIRST)</text>
  <rect x="70" y="176" width="1100" height="180" fill="#FFFFFF" stroke="#1A1A18" stroke-width="1.5"/>

  <!-- route chips -->
  <g font-size="13" font-weight="500" fill="#1A1A18">
    <rect x="100" y="200" width="150" height="44" fill="#F2EDE4" stroke="#D4CEC4"/>
    <text x="175" y="218" text-anchor="middle" font-weight="600">Search</text>
    <text x="175" y="235" text-anchor="middle" font-size="10.5" fill="#5C5C58">/ · origin, date, pax</text>

    <rect x="290" y="200" width="170" height="44" fill="#F2EDE4" stroke="#D4CEC4"/>
    <text x="375" y="218" text-anchor="middle" font-weight="600">Results</text>
    <text x="375" y="235" text-anchor="middle" font-size="10.5" fill="#5C5C58">/results · travel/stays/exp</text>

    <rect x="500" y="200" width="150" height="44" fill="#F2EDE4" stroke="#D4CEC4"/>
    <text x="575" y="218" text-anchor="middle" font-weight="600">Detail pages</text>
    <text x="575" y="235" text-anchor="middle" font-size="10.5" fill="#5C5C58">quote &amp; terms</text>

    <rect x="690" y="200" width="150" height="44" fill="#F2EDE4" stroke="#D4CEC4"/>
    <text x="765" y="218" text-anchor="middle" font-weight="600">Itinerary</text>
    <text x="765" y="235" text-anchor="middle" font-size="10.5" fill="#5C5C58">/itinerary · review</text>

    <rect x="880" y="200" width="130" height="44" fill="#F2EDE4" stroke="#D4CEC4"/>
    <text x="945" y="218" text-anchor="middle" font-weight="600">Confirm</text>
    <text x="945" y="235" text-anchor="middle" font-size="10.5" fill="#5C5C58">/booking/confirm</text>

    <rect x="1050" y="200" width="90" height="44" fill="#F2EDE4" stroke="#D4CEC4"/>
    <text x="1095" y="218" text-anchor="middle" font-weight="600">Trips</text>
    <text x="1095" y="235" text-anchor="middle" font-size="10.5" fill="#5C5C58">/trips · orders</text>
  </g>

  <!-- flow arrows between chips -->
  <g stroke="#9A9A94" stroke-width="1.5" fill="none">
    <line x1="250" y1="222" x2="286" y2="222" marker-end="url(#arrowMuted)"/>
    <line x1="460" y1="222" x2="496" y2="222" marker-end="url(#arrowMuted)"/>
    <line x1="650" y1="222" x2="686" y2="222" marker-end="url(#arrowMuted)"/>
    <line x1="840" y1="222" x2="876" y2="222" marker-end="url(#arrowMuted)"/>
    <line x1="1010" y1="222" x2="1046" y2="222" marker-end="url(#arrowMuted)"/>
  </g>

  <g font-size="11.5" fill="#5C5C58">
    <text x="100" y="276">Auth (sign-in / sign-up · token)   ·   Filters &amp; sort   ·   Loading / partial-result / error states   ·   Responsive UI (Tailwind)</text>
    <text x="100" y="296">Traveller-facing only — BAP is the single backend this client talks to (SRS §10).</text>
  </g>
  <text x="1140" y="276" text-anchor="end" font-size="11" font-style="italic" fill="#9A9A94">Module 1</text>

  <!-- HTTPS connector down to BAP -->
  <line x1="620" y1="356" x2="620" y2="416" stroke="#1A1A18" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640" y="384" font-size="11.5" fill="#5C5C58">HTTPS / TLS · authenticated REST</text>
  <text x="640" y="400" font-size="11.5" font-weight="600" fill="#1A1A18">POST /api/search · /api/select · /api/confirm · GET /api/orders/:id · POST /api/orders/:id/cancel</text>

  <!-- ══════════════════ LAYER 2 · BAP BACKEND ══════════════════ -->
  <text x="70" y="446" font-size="12" font-weight="700" letter-spacing="2.5" fill="#C84B2F">BAP BACKEND · FASTAPI (MODULE 2)</text>
  <rect x="70" y="460" width="1100" height="250" fill="#1C2B25" stroke="#1A1A18" stroke-width="1.5"/>

  <!-- API gateway + auth -->
  <rect x="100" y="484" width="220" height="70" fill="#243A31" stroke="#4A6B5C" stroke-width="1"/>
  <text x="210" y="512" text-anchor="middle" font-size="13" font-weight="600" fill="#F2EDE4">API Gateway + Auth</text>
  <text x="210" y="530" text-anchor="middle" font-size="10.5" fill="#9DB5A9">token validation · rate limits</text>

  <!-- orchestration core -->
  <rect x="360" y="484" width="330" height="70" fill="#243A31" stroke="#4A6B5C" stroke-width="1"/>
  <text x="525" y="512" text-anchor="middle" font-size="13" font-weight="600" fill="#F2EDE4">Transaction Orchestrator</text>
  <text x="525" y="530" text-anchor="middle" font-size="10.5" fill="#9DB5A9">aggregation window · order state machine</text>

  <!-- Beckn action builder -->
  <rect x="730" y="484" width="410" height="70" fill="#243A31" stroke="#4A6B5C" stroke-width="1"/>
  <text x="935" y="512" text-anchor="middle" font-size="13" font-weight="600" fill="#F2EDE4">Beckn Action Builder / Validator</text>
  <text x="935" y="530" text-anchor="middle" font-size="10.5" fill="#9DB5A9">payload schema validation (SRS FR-13)</text>

  <!-- Beckn actions row -->
  <g font-size="12" font-weight="600" fill="#1A1A18" text-anchor="middle">
    <rect x="100" y="586" width="128" height="42" fill="#F2EDE4" stroke="#D4CEC4"/><text x="164" y="611">search</text>
    <rect x="244" y="586" width="128" height="42" fill="#F2EDE4" stroke="#D4CEC4"/><text x="308" y="611">select</text>
    <rect x="388" y="586" width="128" height="42" fill="#F2EDE4" stroke="#D4CEC4"/><text x="452" y="611">init</text>
    <rect x="532" y="586" width="128" height="42" fill="#F2EDE4" stroke="#D4CEC4"/><text x="596" y="611">confirm</text>
    <rect x="676" y="586" width="128" height="42" fill="#F2EDE4" stroke="#D4CEC4"/><text x="740" y="611">status / track</text>
    <rect x="820" y="586" width="128" height="42" fill="#F2EDE4" stroke="#D4CEC4"/><text x="884" y="611">cancel</text>
  </g>
  <g font-size="11.5" fill="#9DB5A9">
    <text x="100" y="662">Requests fan out to provider adapters; responses aggregated within a fixed time window.</text>
    <text x="100" y="682">Callback receivers (on_search · on_select · on_init · on_confirm · on_status · on_track · on_cancel) log late/failed provider callbacks.</text>
  </g>
  <text x="1140" y="662" text-anchor="end" font-size="11" font-style="italic" fill="#7A9284">Module 2</text>

  <!-- BAP → gateway/adapters -->
  <line x1="620" y1="710" x2="620" y2="770" stroke="#1A1A18" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640" y="738" font-size="11.5" fill="#5C5C58">Beckn-formatted requests · JSON over HTTPS</text>
  <text x="640" y="756" font-size="11.5" fill="#5C5C58">via live Beckn Gateway (when available) or direct to adapters</text>

  <!-- ══════════════════ LAYER 3 · GATEWAY / ADAPTERS ═══════════ -->
  <text x="70" y="800" font-size="12" font-weight="700" letter-spacing="2.5" fill="#C84B2F">BECKN GATEWAY &amp; PROVIDER ADAPTERS · BPP (MODULE 3)</text>
  <rect x="70" y="814" width="1100" height="270" fill="#FFFFFF" stroke="#1A1A18" stroke-width="1.5"/>

  <!-- gateway -->
  <rect x="100" y="840" width="500" height="64" fill="#F2EDE4" stroke="#1A1A18" stroke-width="1" stroke-dasharray="6 4"/>
  <text x="350" y="866" text-anchor="middle" font-size="13" font-weight="600" fill="#1A1A18">Beckn Gateway / Registry (optional in dev)</text>
  <text x="350" y="884" text-anchor="middle" font-size="10.5" fill="#5C5C58">routes search/select/init/confirm to subscribed BPPs</text>

  <!-- adapter registry -->
  <rect x="640" y="840" width="500" height="64" fill="#F2EDE4" stroke="#D4CEC4"/>
  <text x="890" y="866" text-anchor="middle" font-size="13" font-weight="600" fill="#1A1A18">Provider Adapter Registry</text>
  <text x="890" y="884" text-anchor="middle" font-size="10.5" fill="#5C5C58">mock or real · new adapters plug in without core changes (FR-14)</text>

  <!-- connector gateway <-> registry -->
  <line x1="600" y1="872" x2="636" y2="872" stroke="#9A9A94" stroke-width="1.5" marker-end="url(#arrowMuted)"/>

  <!-- three provider adapters -->
  <g font-size="13" font-weight="600" fill="#1A1A18" text-anchor="middle">
    <rect x="100"  y="936" width="330" height="112" fill="#F2EDE4" stroke="#D4CEC4"/>
    <rect x="455"  y="936" width="330" height="112" fill="#F2EDE4" stroke="#D4CEC4"/>
    <rect x="810"  y="936" width="330" height="112" fill="#F2EDE4" stroke="#D4CEC4"/>
  </g>
  <g>
    <text x="265"  y="962" text-anchor="middle" font-size="13" font-weight="700" fill="#1A1A18">Transport Adapter</text>
    <text x="265"  y="981" text-anchor="middle" font-size="10.5" fill="#5C5C58">Flights · Trains · Buses</text>
    <text x="265"  y="1006" text-anchor="middle" font-size="10.5" fill="#5C5C58">native API → Beckn catalog (on_search)</text>
    <text x="265"  y="1024" text-anchor="middle" font-size="10.5" fill="#5C5C58">Beckn confirm → provider booking</text>
    <text x="265"  y="1042" text-anchor="middle" font-size="10.5" fill="#9A9A94" font-style="italic">SkyConnect · Railways · Intercity</text>

    <text x="620"  y="962" text-anchor="middle" font-size="13" font-weight="700" fill="#1A1A18">Accommodation Adapter</text>
    <text x="620"  y="981" text-anchor="middle" font-size="10.5" fill="#5C5C58">Hotels &amp; stays</text>
    <text x="620"  y="1006" text-anchor="middle" font-size="10.5" fill="#5C5C58">geospatial proximity results (GIS)</text>
    <text x="620"  y="1024" text-anchor="middle" font-size="10.5" fill="#5C5C58">availability &amp; cancellation policies</text>
    <text x="620"  y="1042" text-anchor="middle" font-size="10.5" fill="#9A9A94" font-style="italic">Hotel partners · home stays</text>

    <text x="975"  y="962" text-anchor="middle" font-size="13" font-weight="700" fill="#1A1A18">Experience Adapter</text>
    <text x="975"  y="981" text-anchor="middle" font-size="10.5" fill="#5C5C58">Local activities &amp; tours</text>
    <text x="975"  y="1006" text-anchor="middle" font-size="10.5" fill="#5C5C58">hosted inventory → Beckn catalog</text>
    <text x="975"  y="1024" text-anchor="middle" font-size="10.5" fill="#5C5C58">meeting-point &amp; schedule mapping</text>
    <text x="975"  y="1042" text-anchor="middle" font-size="10.5" fill="#9A9A94" font-style="italic">Local guides · tour hosts</text>
  </g>
  <text x="1140" y="1074" text-anchor="end" font-size="11" font-style="italic" fill="#9A9A94">Module 3</text>

  <!-- Adapters → providers note arrow -->
  <line x1="620" y1="1084" x2="620" y2="1144" stroke="#9A9A94" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowMuted)"/>
  <text x="640" y="1120" font-size="11" fill="#9A9A94" font-style="italic">3+ provider APIs — real sandboxed or documented mock providers (SRS §18)</text>

  <!-- ══════════════════ LAYER 4 · PROVIDERS ════════════════════ -->
  <text x="70" y="1174" font-size="12" font-weight="700" letter-spacing="2.5" fill="#C84B2F">TRAVEL SERVICE PROVIDERS</text>
  <rect x="70" y="1188" width="1100" height="90" fill="#FFFFFF" stroke="#1A1A18" stroke-width="1.5"/>
  <g font-size="12" fill="#1A1A18" text-anchor="middle">
    <rect x="100" y="1212" width="330" height="52" fill="#F2EDE4" stroke="#D4CEC4"/>
    <rect x="455" y="1212" width="330" height="52" fill="#F2EDE4" stroke="#D4CEC4"/>
    <rect x="810" y="1212" width="330" height="52" fill="#F2EDE4" stroke="#D4CEC4"/>
  </g>
  <g>
    <text x="265" y="1234" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1A1A18">Airline / Railway / Bus APIs</text>
    <text x="265" y="1252" text-anchor="middle" font-size="10.5" fill="#5C5C58">inventory · pricing · PNR booking</text>
    <text x="620" y="1234" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1A1A18">Hotel / Stay APIs</text>
    <text x="620" y="1252" text-anchor="middle" font-size="10.5" fill="#5C5C58">room availability · rates · policies</text>
    <text x="975" y="1234" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1A1A18">Experience Host APIs</text>
    <text x="975" y="1252" text-anchor="middle" font-size="10.5" fill="#5C5C58">activity slots · capacity · pricing</text>
  </g>

  <!-- ══════════════════ LAYER 5 · DATA ═════════════════════════ -->
  <text x="70" y="1318" font-size="12" font-weight="700" letter-spacing="2.5" fill="#C84B2F">DATA, CACHING &amp; GIS · MODULE 4</text>
  <rect x="70" y="1332" width="1100" height="180" fill="#1C2B25" stroke="#1A1A18" stroke-width="1.5"/>

  <!-- MongoDB -->
  <rect x="100" y="1360" width="520" height="128" fill="#243A31" stroke="#4A6B5C" stroke-width="1"/>
  <text x="130" y="1392" font-size="14" font-weight="700" fill="#F2EDE4">MongoDB</text>
  <text x="130" y="1410" font-size="10.5" fill="#9DB5A9">persistent store</text>
  <g font-size="11.5" fill="#F2EDE4">
    <rect x="130" y="1424" width="140" height="24" fill="#1C2B25" stroke="#4A6B5C" stroke-width="0.75"/><text x="200" y="1440" text-anchor="middle">catalog</text>
    <rect x="282" y="1424" width="140" height="24" fill="#1C2B25" stroke="#4A6B5C" stroke-width="0.75"/><text x="352" y="1440" text-anchor="middle">orders</text>
    <rect x="130" y="1454" width="140" height="24" fill="#1C2B25" stroke="#4A6B5C" stroke-width="0.75"/><text x="200" y="1470" text-anchor="middle">user journeys</text>
    <rect x="282" y="1454" width="140" height="24" fill="#1C2B25" stroke="#4A6B5C" stroke-width="0.75"/><text x="352" y="1470" text-anchor="middle">providers</text>
  </g>
  <text x="590" y="1440" text-anchor="end" font-size="10.5" fill="#9DB5A9">order state: created → selected</text>
  <text x="590" y="1456" text-anchor="end" font-size="10.5" fill="#9DB5A9">→ initiated → confirmed → cancelled</text>

  <!-- Redis -->
  <rect x="650" y="1360" width="490" height="128" fill="#243A31" stroke="#4A6B5C" stroke-width="1"/>
  <text x="680" y="1392" font-size="14" font-weight="700" fill="#F2EDE4">Redis Cache</text>
  <text x="680" y="1410" font-size="10.5" fill="#9DB5A9">TTL-based price / availability data</text>
  <g font-size="11.5" fill="#F2EDE4">
    <rect x="680" y="1424" width="200" height="24" fill="#1C2B25" stroke="#4A6B5C" stroke-width="0.75"/><text x="780" y="1440" text-anchor="middle">price cache (TTL window)</text>
    <rect x="892" y="1424" width="218" height="24" fill="#1C2B25" stroke="#4A6B5C" stroke-width="0.75"/><text x="1001" y="1440" text-anchor="middle">aggregated search results</text>
    <rect x="680" y="1454" width="200" height="24" fill="#1C2B25" stroke="#4A6B5C" stroke-width="0.75"/><text x="780" y="1470" text-anchor="middle">geospatial query results</text>
    <rect x="892" y="1454" width="218" height="24" fill="#1C2B25" stroke="#4A6B5C" stroke-width="0.75"/><text x="1001" y="1470" text-anchor="middle">callback / timeout log</text>
  </g>

  <!-- data layer connectors up to BAP (side rails) -->
  <path d="M 70 1422 H 46 V 585 H 70" fill="none" stroke="#C84B2F" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <path d="M 1170 1422 H 1194 V 585 H 1170" fill="none" stroke="#C84B2F" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="34" y="1010" font-size="11" fill="#C84B2F" transform="rotate(-90 34 1010)" text-anchor="middle">orders · catalog · journeys (persist)</text>
  <text x="1206" y="1010" font-size="11" fill="#C84B2F" transform="rotate(90 1206 1010)" text-anchor="middle">cache reads / writes · TTL refresh</text>

  <!-- ══════════════════ KPI footer ═════════════════════════════ -->
  <rect x="70" y="1540" width="1100" height="120" fill="#FFFFFF" stroke="#1A1A18" stroke-width="1.5"/>
  <text x="100" y="1572" font-size="12" font-weight="700" letter-spacing="2.5" fill="#C84B2F">PERFORMANCE TARGETS &amp; GUARANTEES (SRS §8 / §19)</text>
  <g font-size="12.5" fill="#1A1A18">
    <text x="100" y="1602">⏱ Search response &lt; 3 s (aggregation window)</text>
    <text x="100" y="1626">📈 Journey completion &gt; 70% (search → booking)</text>
    <text x="470" y="1602">🛡 All endpoints authenticated · HTTPS/TLS</text>
    <text x="470" y="1626">🔁 Partial results tolerated — one provider failure never blocks others</text>
    <text x="870" y="1602">📍 GIS proximity filtering</text>
    <text x="870" y="1626">🧩 Modular: new providers/categories plug in</text>
  </g>

  <!-- legend -->
  <g font-size="11" fill="#5C5C58">
    <rect x="70" y="1690" width="16" height="16" fill="#1C2B25" stroke="#1A1A18"/><text x="94" y="1702">BAP backend services (FastAPI)</text>
    <rect x="320" y="1690" width="16" height="16" fill="#FFFFFF" stroke="#1A1A18"/><text x="344" y="1702">frontend / adapter / data layer</text>
    <line x1="590" y1="1698" x2="640" y2="1698" stroke="#1A1A18" stroke-width="2" marker-end="url(#arrow)"/><text x="650" y="1702">request flow</text>
    <line x1="770" y1="1698" x2="820" y2="1698" stroke="#C84B2F" stroke-width="2" marker-end="url(#arrowOrange)"/><text x="830" y="1702">data persistence / cache flow</text>
    <line x1="1010" y1="1698" x2="1060" y2="1698" stroke="#9A9A94" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowMuted)"/><text x="1070" y="1702">optional / external</text>
  </g>

  <text x="620" y="1758" text-anchor="middle" font-size="11" font-style="italic" fill="#9A9A94">Beckn-Based Travel Discovery Engine · DE 5 · SRS §10 layered architecture — generated with Codebuff</text>
</svg>
